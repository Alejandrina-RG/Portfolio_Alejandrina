<style>
:root{--bg:#09090b;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--ink:#f4f4f6;--mute:#9a9aa8;--yel:#e9f84c;--white:#fff;--on-white:#0b0b0d;
--f:'Inter Tight','Helvetica Neue',Arial,system-ui,sans-serif;--s:'Dancing Script','Brush Script MT',cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 0,rgba(110,90,255,.16),transparent 70%),radial-gradient(40% 30% at 100% 60%,rgba(0,190,200,.1),transparent 70%);z-index:-1}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.035em;line-height:1.02}
.g{background:linear-gradient(180deg,#fff 30%,#8d8d98);-webkit-background-clip:text;background-clip:text;color:transparent}
.g2{background:linear-gradient(90deg,#e24cff,#2fb0ff 55%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{font-family:var(--s);font-weight:500;font-size:1.12em;letter-spacing:0}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
/* nav */
nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 0}
nav .logo{font-size:30px;font-weight:700;line-height:1}
nav .mid{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px;backdrop-filter:blur(12px)}
nav .mid a{text-decoration:none;font-size:14px;padding:8px 18px;border-radius:999px;color:var(--mute)}
nav .mid a:first-child{color:#fff;background:rgba(255,255,255,.1)}
nav .r{justify-self:end;display:flex;gap:18px;align-items:center;font-size:14px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--white);color:var(--on-white);border:0;border-radius:999px;padding:10px 10px 10px 22px;font:500 15px var(--f);cursor:pointer;text-decoration:none}
.btn.sm{padding:11px 22px}
.btn .ar{width:30px;height:30px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-size:15px}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
/* hero */
.hero{text-align:center;padding:54px 0 0;position:relative}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.eyebrow b{color:var(--yel);font-weight:500;background:rgba(233,248,76,.1);padding:3px 9px;border-radius:6px}
.hero h1{font-size:clamp(40px,7.4vw,86px);margin:20px 0 0}
.hero p{max-width:52ch;margin:22px auto 0;color:var(--mute);font-size:17px}
.tag{position:absolute;font-size:12px;font-weight:500;padding:5px 13px;border-radius:7px;color:#0b0b0d}
.tag svg{position:absolute;top:-9px;right:-9px;width:16px}
.fan{position:relative;height:340px;margin-top:40px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;mask-image:linear-gradient(#000 82%,transparent)}
.fan .card{position:absolute;bottom:-70px;width:min(26vw,230px);aspect-ratio:3/4}
.fan .c1{transform:translateX(-215%) rotate(-9deg)}.fan .c2{transform:translateX(-108%) translateY(-8px) rotate(-4.5deg)}
.fan .c3{width:min(34vw,300px);bottom:-60px;z-index:3}
.fan .c4{transform:translateX(108%) translateY(-8px) rotate(4.5deg)}.fan .c5{transform:translateX(215%) rotate(9deg)}
.fan .btn{position:absolute;right:14px;top:12px;z-index:5}
/* cards */
.card{position:relative;overflow:hidden;border-radius:26px;padding:20px;display:flex;flex-direction:column;isolation:isolate;color:#fff;border:1px solid rgba(255,255,255,.18)}
.card h4{margin:0;font:600 clamp(20px,2.6vw,28px)/1 var(--f);letter-spacing:-.03em}
.card small{display:block;opacity:.7;font-size:13px;margin-top:5px}
.card .o{position:absolute;border-radius:50%;z-index:-1}
.card.dk{color:#0b0b0d}
.card .bd{position:absolute;top:14px;right:14px;background:var(--yel);color:#0b0b0d;font:600 11px var(--f);padding:3px 10px;border-radius:99px}
.k1{background:linear-gradient(160deg,#6b55d9,#3d3aa8)}.k2{background:linear-gradient(160deg,#ff7b86,#e0486a)}
.k3{background:linear-gradient(160deg,#25aec4,#0f7f9a)}.k4{background:linear-gradient(160deg,#78e276,#3fbf6a)}
.k5{background:linear-gradient(160deg,#5a56e0,#2b2d9c)}.k6{background:linear-gradient(160deg,#ffcf4a,#ff8a4a)}
.o1{background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.55) 18%,rgba(255,255,255,.12) 60%);box-shadow:inset -10px -14px 30px rgba(0,0,0,.25)}
.o2{background:radial-gradient(circle at 30% 30%,#ffd3ec,#ff4fa0 55%,#9b1d73);box-shadow:inset -8px -10px 22px rgba(0,0,0,.3)}
.o3{background:radial-gradient(circle at 30% 30%,#c9f6ff,#3fb4ff 55%,#2147c9)}
.o4{background:radial-gradient(circle at 30% 30%,#fff7c2,#f6e640 60%,#c6a300)}
.anim .o{animation:fl 3s ease-in-out infinite alternate}.anim .o:nth-of-type(2){animation-delay:-1.2s}
@keyframes fl{to{transform:translateY(-14px) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.anim .o{animation:none}}
.r45{aspect-ratio:4/5}.r11{aspect-ratio:1}.r23{aspect-ratio:2/3}.r916{aspect-ratio:9/16}
.art,.im{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.im{object-fit:cover}
.art .wv{animation:wv 4s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(-10px)}}
@media (prefers-reduced-motion:reduce){.art .wv{animation:none}}
.card:has(.art),.card:has(.im){box-shadow:inset 0 -90px 70px -40px rgba(0,0,0,.25)}
/* sections */
section{padding:84px 0 20px}
section h2{font-size:clamp(32px,5vw,56px)}
.sub{color:var(--mute);margin:14px 0 28px;max-width:56ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.tabs button{background:var(--glass);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:9px 18px;font:500 14px var(--f);cursor:pointer}
.tabs button[aria-pressed=true]{background:#fff;color:#0b0b0d;border-color:#fff}
.grid{columns:4 230px;column-gap:16px}
.item{break-inside:avoid;margin:0 0 16px}
.item .card{border-radius:26px}
.cap{padding:9px 6px 0;font-size:14px;color:var(--mute)}.cap b{display:block;color:var(--ink);font-weight:500}
/* tiers */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tier{text-align:left;font:inherit;cursor:pointer;min-height:230px;justify-content:space-between;opacity:.62;transition:opacity .2s,transform .2s}
.tier[aria-pressed=true]{opacity:1;transform:translateY(-6px);box-shadow:0 0 0 2px #fff,0 18px 40px rgba(0,0,0,.5)}
.tier .n{font:600 64px/1 var(--f);letter-spacing:-.05em}
.tier .p{font-weight:500}
.cust{display:none;margin-top:14px}.cust.on{display:block}
.q{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:20px}
.pan{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:24px;backdrop-filter:blur(10px)}
.pan h3{font-size:24px;margin-bottom:14px}
.ex label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.ex label:first-of-type{border-top:0}
.ex input{margin-top:5px;accent-color:var(--yel);width:17px;height:17px}
.ex em{margin-left:auto;font-style:normal;font-weight:500;white-space:nowrap}
.ex small{color:var(--mute)}
input[type=number],input[type=text],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.35);color:var(--ink);font:inherit}
.f label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mute)}
.ln{display:flex;justify-content:space-between;font-size:15px;padding:4px 0;color:var(--mute)}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:14px}
.tot b{font:600 40px var(--f);letter-spacing:-.04em}
.msg{font-size:13px;color:var(--mute);margin-top:10px;min-height:20px}
footer{padding:60px 0 50px;color:var(--mute);font-size:14px}
@media(max-width:820px){nav{grid-template-columns:1fr auto}nav .mid{display:none}.q{grid-template-columns:1fr}
.fan{height:300px}.fan .card{width:34vw}.fan .c1,.fan .c5{display:none}.fan .c2{transform:translateX(-95%) rotate(-5deg)}.fan .c4{transform:translateX(95%) rotate(5deg)}.fan .c3{width:42vw}.tag{display:none}}
.lang{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:var(--mute);font:500 12px var(--f);padding:6px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#0b0b0d}
</style>
</head>

if(k==="flyer"){const x=55+p(30),y=48+p(14);for(let j=0;j<16;j++){const a=j*Math.PI/8;g+=`<path d="M${x} ${y}L${x+Math.cos(a)*90} ${y+Math.sin(a)*90}" stroke="${W}.${j%2?10:20})" stroke-width="5"/>`}g+=`<circle cx="${x}" cy="${y}" r="24" fill="${W}.28)"/><circle cx="${x}" cy="${y}" r="12" fill="${W}.85)"/><path d="M0 ${84+p(8)}Q50 ${68+p(10)} 100 ${86+p(6)}V100H0z" fill="${B}.28)"/>`}
else if(k==="redes"){for(let a=0;a<4;a++)for(let b=0;b<4;b++)g+=`<rect x="${10+b*21}" y="${34+a*16}" width="17" height="12" rx="4" fill="${W}.${(8+p(24))/100})"/>`;g+=`<circle cx="${70+p(15)}" cy="${28+p(10)}" r="13" fill="${W}.5)"/>`}
else if(k==="anim"){for(let j=0;j<6;j++){const y=40+j*10;g+=`<path class="wv" d="M-10 ${y}Q10 ${y-12} 30 ${y}T70 ${y}T110 ${y}" fill="none" stroke="${W}${j%2?.25:.55})" stroke-width="3" stroke-linecap="round"/>`}g+=`<circle cx="${25+p(50)}" cy="26" r="10" fill="${W}.9)"/>`}
else{for(let j=0;j<4;j++)g+=`<path d="M${j*25+3} 100V${60-j%2*14}a10 10 0 0 1 19 0V100z" fill="${j%2?B+".22)":W+".3)"}"/>`;g+=`<circle cx="${50+p(25)}" cy="${28+p(8)}" r="16" fill="${W}.8)"/>`}
return `<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg>`};
const blobs='<i class="o o1" style="width:62%;aspect-ratio:1;right:-8%;bottom:-6%"></i><i class="o o2" style="width:30%;aspect-ratio:1;left:12%;bottom:22%"></i><i class="o o3" style="width:20%;aspect-ratio:1;right:18%;top:38%"></i>';
function card(o,extra=""){return `<div class="card ${o.s} ${o.r||""} ${o.dk?"dk":""} ${o.a?"anim":""} ${extra}">${o.a?`<span class="bd">${t("bd")}</span>`:""}<h4>${o.h}</h4><small>${o.sm}</small>${o.img?`<img class="im" src="${o.img}" alt="${o.h}" loading="lazy">`:o.c?A(o.c,o.i||0):blobs}</div>`}
let cat="todos",sel=1;const ex=new Set();
function qty(){return TIERS[sel].c?Math.max(60,parseInt($("#cn").value)||60):TIERS[sel].n}
function drawFan(){$("#fan").innerHTML=HERO.map((h,i)=>card({h:t(h[0]),sm:t(h[1]),s:h[2],a:h[3],dk:h[4],c:["flyer","redes","anim","cartel","anim"][i],i:i+1},"c"+(i+1))).join("")+`<a class="btn" href="#paquetes">${t("start")} <span class="ar">↗</span></a>`}
function drawTabs(){$("#tabs").innerHTML=CATS.map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===cat}">${t(k)}</button>`).join("")}
function drawGrid(){$("#grid").innerHTML=WORKS.map((w,i)=>({...w,i})).filter(w=>cat==="todos"||w.c===cat).map(w=>`<figure class="item" style="margin:0 0 16px">${card({...w,h:w.t[LN.indexOf(lang)],sm:t(w.k)})}</figure>`).join("")}
function drawTiers(){
  $("#tiers").innerHTML=TIERS.map((x,i)=>`<button type="button" class="card tier ${x.k} ${x.dk?"dk":""}" data-i="${i}" aria-pressed="${i===sel}">${x.tag?`<span class="bd">${t(x.tag)}</span>`:""}<div><small style="margin:0 0 6px">${t("pieces")}</small><div class="n">${x.n}</div></div><div class="p">${fmt(x.ppp)} ${t("per")}</div>${blobs}</button>`).join("");
  $("#cust").classList.toggle("on",!!TIERS[sel].c);
}
function drawExtras(){$("#extras").innerHTML=EXTRAS.map(e=>`<label><input type="checkbox" value="${e.id}" ${ex.has(e.id)?"checked":""}><span>${t(e.id+"_t")}<br><small>${t(e.id+"_d")}</small></span><em>+${fmt(e.ppp)}${t("ppp")}</em></label>`).join("")}
function calc(){
  const n=qty(),x=TIERS[sel];let rows=[[`${n} ${t("pieces")} × ${fmt(x.ppp)}`,n*x.ppp]];
  EXTRAS.filter(e=>ex.has(e.id)).forEach(e=>rows.push([`${t(e.id+"_t")} × ${n}`,n*e.ppp]));
  const tot=rows.reduce((a,r)=>a+r[1],0);
  $("#lines").innerHTML=rows.map(r=>`<div class="ln"><span>${r[0]}</span><span>${fmt(r[1])}</span></div>`).join("");
  $("#total").textContent=fmt(tot);
  return {n,rows,tot};
}
function render(){
  document.documentElement.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("#tabs").setAttribute("aria-label",t("w1"));
  $("#foot").textContent="© "+new Date().getFullYear()+" "+CFG.marca+". "+t("foot");
  $("#msg").textContent="";
  drawFan();drawTabs();drawGrid();drawTiers();drawExtras();calc();
}
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}render()});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.k;drawTabs();drawGrid()});
$("#tiers").addEventListener("click",e=>{const b=e.target.closest(".tier");if(!b)return;sel=+b.dataset.i;drawTiers();calc()});
$("#extras").addEventListener("change",e=>{e.target.checked?ex.add(e.target.value):ex.delete(e.target.value);calc()});
$("#cn").addEventListener("input",calc);
$("#send").addEventListener("click",()=>{
  const {n,rows,tot}=calc(),nm=$("#nm").value.trim(),nt=$("#nt").value.trim();
  if(!nm){$("#msg").textContent=t("err");$("#nm").focus();return}
  const txt=t("wa").replace("{n}",n)+"\n"+rows.map(r=>`• ${r[0]}: ${fmt(r[1])}`).join("\n")+`\n${t("wtot")}: ${fmt(tot)}\n${t("wnm")}: ${nm}`+(nt?`\n${t("wpr")}: ${nt}`:"");
  $("#msg").textContent=t("open");
  window.open("https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent(txt),"_blank","noopener");
});
render();
</script>
</body>
</html>
